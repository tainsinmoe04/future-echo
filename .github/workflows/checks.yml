name: Future Echo checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ORIGIN: "https://future-echo.invalid"
      SUPABASE_URL: ""
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      FUTURE_ECHO_AI_ENABLED: "false"
      FUTURE_ECHO_LOCAL_AI: "false"
      FUTURE_ECHO_OPENROUTER_TRIAL: "false"
      FUTURE_ECHO_OLLAMA_WINDOWS_BRIDGE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Repository credential and artifact hygiene
        run: |
          node scripts/verify-repository-security.mjs --self-test
          node scripts/verify-repository-security.mjs
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: npm exec --no -- tsc --noEmit
      - run: npm test
      - run: npm run test:db
      - run: npm run lint
      - run: npm run build
      - run: npm exec --no -- playwright install --with-deps chromium
      - run: npm run test:e2e
